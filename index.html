<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="A simple browser tool for copying and pasting text with the modern Clipboard API.">
    <meta name="author" content="Javin Arora">
    <meta name="theme-color" content="#111827">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Copy-Paste Helper">
    <meta property="og:description" content="Copy and paste text with browser clipboard APIs.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Copy-Paste Helper">
    <meta name="twitter:description" content="Copy and paste text with browser clipboard APIs.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy-Paste Helper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="icon">✓</div>
                <h1>Copy-Paste Helper</h1>
            </div>
            
            <div class="content">
                <div class="textarea-wrapper">
                    <label for="textArea">Your Text:</label>
                    <textarea 
                        id="textArea" 
                        placeholder="Type or paste your text here..."
                        rows="10"
                    ></textarea>
                </div>
                
                <div class="button-group">
                    <button id="copyBtn" class="btn btn-copy">
                        <span class="btn-icon">📋</span>
                        Copy Text
                    </button>
                    <button id="pasteBtn" class="btn btn-paste">
                        <span class="btn-icon">📥</span>
                        Paste Text
                    </button>
                </div>
                
                <div id="statusMessage" class="status-message"></div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
